name: Deploy Nexus Agent

# Cuándo se ejecuta este pipeline
on:
  push:
    branches:
      - main        # Cuando alguien sube código a main
      - develop     # O a develop

jobs:
  deploy:
    name: Deploy a la VM
    runs-on: ubuntu-latest  # GitHub usa una máquina Ubuntu para ejecutar esto

    steps:
      # 1. Descarga el código del repo
      - name: Checkout código
        uses: actions/checkout@v3

      # 2. Se conecta a la VM por SSH y actualiza el código
      - name: Deploy en VM GCP
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}        # IP de la VM
          username: ${{ secrets.VM_USER }}    # Usuario de la VM (desarrollo)
          key: ${{ secrets.VM_SSH_KEY }}      # Clave SSH privada
          script: |
            cd ~/nexus-app
            git pull origin develop
            cd backend
            source ~/nexus-app/venv/bin/activate
            pip install -r requirements.txt
            echo "✅ Deploy completado"
            sudo systemctl restart aratalent
            
